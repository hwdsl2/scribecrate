name: test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'api_server.py'
      - 'diarizer.py'
      - 'run.sh'
      - 'manage.sh'
      - 'Dockerfile*'
      - 'notebooks/colab_demo.ipynb'
      - 'whisper.env.example'
  push:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - '.github/workflows/shellcheck.yml'
      - '.github/workflows/whisper_test.yml'
      - '.github/workflows/cuda_test.yml'
      - '.github/workflows/tests/**'
      - 'api_server.py'
      - 'diarizer.py'
      - 'run.sh'
      - 'manage.sh'
      - 'Dockerfile*'
      - 'notebooks/colab_demo.ipynb'
      - 'whisper.env.example'

permissions:
  contents: read

jobs:
  shellcheck:
    if: github.repository_owner == 'hwdsl2'
    uses: ./.github/workflows/shellcheck.yml

  whisper_test:
    if: github.repository_owner == 'hwdsl2'
    uses: ./.github/workflows/whisper_test.yml

  cuda_test:
    if: github.repository_owner == 'hwdsl2'
    uses: ./.github/workflows/cuda_test.yml
