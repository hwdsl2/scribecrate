name: buildx-cuda

on:
  workflow_call:
    inputs:
      no_cache:
        required: false
        type: boolean
        default: false
    secrets:
      CACHE_NAME:
        required: true
      DOCKER_TOKEN:
        required: true
      QUAY_USER:
        required: true
      QUAY_TOKEN:
        required: true
      BUILD_ONLY:
        required: true

permissions:
  contents: read

jobs:
  buildx-cuda:
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'hwdsl2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache-cuda
          key: ${{ secrets.CACHE_NAME }}-cuda-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ secrets.CACHE_NAME }}-cuda-
      - name: Set up Buildx
        id: setup_buildx
        shell: bash
        run: |
          docker buildx version
          docker info

          builder="builder-cuda-${GITHUB_SHA::8}"
          docker buildx create --name "$builder" --driver docker-container --use
          printf 'builder=%s\n' "$builder" >> "$GITHUB_OUTPUT"
          docker buildx inspect --bootstrap "$builder"
      - name: Quay.io Login
        env:
          QUAY_USER: ${{ secrets.QUAY_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: echo "$QUAY_TOKEN" | docker login quay.io --username "$QUAY_USER" --password-stdin 2>&1
      - name: Docker Hub Login
        env:
          DOCKER_USER: ${{ github.repository_owner }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: echo "$DOCKER_TOKEN" | docker login --username "$DOCKER_USER" --password-stdin 2>&1
      - name: Docker Buildx
        env:
          DOCKER_USER: ${{ github.repository_owner }}
          BUILD_ONLY: ${{ secrets.BUILD_ONLY }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          cd "$GITHUB_WORKSPACE"
          pwd
          ls -ld Dockerfile.cuda

          [ "$BUILD_ONLY" = "true" ] && BUILD_ONLY=""
          ts_now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          NO_CACHE_ARGS=()
          if [ "${{ inputs.no_cache }}" = "true" ]; then
            NO_CACHE_ARGS=(--no-cache)
          fi

          docker buildx build \
            --progress plain \
            --platform=linux/amd64 \
            --build-arg "BUILD_DATE=$ts_now" \
            --build-arg "VCS_REF=${GITHUB_SHA::8}" \
            --build-arg "VERSION=cuda" \
            "${NO_CACHE_ARGS[@]}" \
            --cache-from type=local,src="${RUNNER_TEMP}/.buildx-cache-cuda" \
            --cache-to type=local,dest="${RUNNER_TEMP}/.buildx-cache-cuda-new" \
            -f Dockerfile.cuda \
            -t "$DOCKER_USER/whisper-server:cuda" \
            --pull \
            ${BUILD_ONLY:+--push} \
            .

          docker buildx build \
            --progress plain \
            --platform=linux/amd64 \
            --build-arg "BUILD_DATE=$ts_now" \
            --build-arg "VCS_REF=${GITHUB_SHA::8}" \
            --build-arg "VERSION=cuda" \
            --cache-from type=local,src="${RUNNER_TEMP}/.buildx-cache-cuda-new" \
            -f Dockerfile.cuda \
            -t "quay.io/$DOCKER_USER/whisper-server:cuda" \
            --pull \
            ${BUILD_ONLY:+--push} \
            .

          /bin/rm -rf "${RUNNER_TEMP}/.buildx-cache-cuda"
          /bin/mv -f "${RUNNER_TEMP}/.buildx-cache-cuda-new" "${RUNNER_TEMP}/.buildx-cache-cuda"
      - name: Clear
        if: always()
        env:
          BUILDER_NAME: ${{ steps.setup_buildx.outputs.builder }}
        run: |
          docker_config="${HOME}/.docker/config.json"
          if [ -f "$docker_config" ]; then
            shred -u "$docker_config" || rm -f "$docker_config"
          fi
          if [ -n "$BUILDER_NAME" ]; then
            docker buildx rm "$BUILDER_NAME" || true
          fi
