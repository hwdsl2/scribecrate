name: Secret file inputs

on:
  pull_request:
    paths: ['run.sh', 'manage.sh', 'Dockerfile*', 'docs/examples/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['run.sh', 'manage.sh', 'Dockerfile*', 'docs/examples/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check source, file and helper behavior
        run: python3 -B -I .github/workflows/tests/test_secret_files.py -v
      - name: Validate opt-in Compose examples
        run: |
          secret_fixture=$(mktemp)
          trap 'rm -f "$secret_fixture"' EXIT
          printf '%s\n' synthetic-compose-fixture > "$secret_fixture"
          for base in docker-compose.yml docker-compose.cuda.yml; do
            [ ! -f "$base" ] || SECRET_FILE_IMAGE=secret-files-candidate:local SECRET_FILE_PATH="$secret_fixture" \
              docker compose --env-file /dev/null -f "$base" -f docs/examples/compose.secrets.yml config --quiet
          done
          if env -u SECRET_FILE_IMAGE SECRET_FILE_PATH="$secret_fixture" \
            docker compose --env-file /dev/null -f docker-compose.yml -f docs/examples/compose.secrets.yml config --quiet 2>/dev/null; then
            echo "Expected an explicit compatible-image selection"; exit 1
          fi
      - name: Check shell syntax
        run: bash -n run.sh && bash -n manage.sh
