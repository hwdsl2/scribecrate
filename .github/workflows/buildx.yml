name: buildx

on:
  workflow_call:
    secrets:
      CACHE_NAME:
        required: true
      DOCKER_TOKEN:
        required: true
      QUAY_USER:
        required: true
      QUAY_TOKEN:
        required: true
      BUILD_ONLY:
        required: true

permissions:
  contents: read

jobs:
  buildx-amd64:
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'hwdsl2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.docker-images
          key: ${{ secrets.CACHE_NAME }}-amd64-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ secrets.CACHE_NAME }}-amd64-
      - name: Set up Buildx
        id: setup_buildx
        shell: bash
        run: |
          docker buildx version
          docker info
          builder="builder-${GITHUB_SHA::8}"
          docker buildx create --name "$builder" --driver docker-container --use
          printf 'builder=%s\n' "$builder" >> "$GITHUB_OUTPUT"
          docker buildx inspect --bootstrap "$builder"
      - name: Quay.io Login
        env:
          QUAY_USER: ${{ secrets.QUAY_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: echo "$QUAY_TOKEN" | docker login quay.io --username "$QUAY_USER" --password-stdin 2>&1
      - name: Docker Hub Login
        env:
          DOCKER_USER: ${{ github.repository_owner }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: echo "$DOCKER_TOKEN" | docker login --username "$DOCKER_USER" --password-stdin 2>&1
      - name: Docker Buildx (amd64)
        env:
          DOCKER_USER: ${{ github.repository_owner }}
          BUILD_ONLY: ${{ secrets.BUILD_ONLY }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          cd "$GITHUB_WORKSPACE"
          pwd
          ls -ld whisper.env.example

          [ "$BUILD_ONLY" = "true" ] && BUILD_ONLY=""
          ts_now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          docker buildx build \
            --progress plain \
            --platform=linux/amd64 \
            --build-arg BUILD_DATE=$ts_now \
            --build-arg VCS_REF=${GITHUB_SHA::8} \
            --build-arg VERSION=latest \
            --cache-from type=local,src="${RUNNER_TEMP}/.buildx-cache" \
            --cache-to type=local,dest="${RUNNER_TEMP}/.buildx-cache-new" \
            -t "$DOCKER_USER/whisper-server:latest-amd64" \
            --pull \
            ${BUILD_ONLY:+--push} \
            .

          docker buildx build \
            --progress plain \
            --platform=linux/amd64 \
            --build-arg BUILD_DATE=$ts_now \
            --build-arg VCS_REF=${GITHUB_SHA::8} \
            --build-arg VERSION=latest \
            --cache-from type=local,src="${RUNNER_TEMP}/.buildx-cache-new" \
            -t "quay.io/$DOCKER_USER/whisper-server:latest-amd64" \
            --pull \
            ${BUILD_ONLY:+--push} \
            .

          /bin/rm -rf "${RUNNER_TEMP}/.buildx-cache"
          /bin/mv -f "${RUNNER_TEMP}/.buildx-cache-new" "${RUNNER_TEMP}/.buildx-cache"
      - name: Clear
        if: always()
        env:
          BUILDER_NAME: ${{ steps.setup_buildx.outputs.builder }}
        run: |
          docker_config="${HOME}/.docker/config.json"
          if [ -f "$docker_config" ]; then
            shred -u "$docker_config" || rm -f "$docker_config"
          fi
          if [ -n "$BUILDER_NAME" ]; then
            docker buildx rm "$BUILDER_NAME" || true
          fi

  buildx-arm64:
    runs-on: ubuntu-24.04-arm
    if: github.repository_owner == 'hwdsl2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.docker-images
          key: ${{ secrets.CACHE_NAME }}-arm64-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ secrets.CACHE_NAME }}-arm64-
      - name: Set up Buildx
        id: setup_buildx
        shell: bash
        run: |
          docker buildx version
          docker info
          builder="builder-${GITHUB_SHA::8}"
          docker buildx create --name "$builder" --driver docker-container --use
          printf 'builder=%s\n' "$builder" >> "$GITHUB_OUTPUT"
          docker buildx inspect --bootstrap "$builder"
      - name: Quay.io Login
        env:
          QUAY_USER: ${{ secrets.QUAY_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: echo "$QUAY_TOKEN" | docker login quay.io --username "$QUAY_USER" --password-stdin 2>&1
      - name: Docker Hub Login
        env:
          DOCKER_USER: ${{ github.repository_owner }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: echo "$DOCKER_TOKEN" | docker login --username "$DOCKER_USER" --password-stdin 2>&1
      - name: Docker Buildx (arm64)
        env:
          DOCKER_USER: ${{ github.repository_owner }}
          BUILD_ONLY: ${{ secrets.BUILD_ONLY }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          cd "$GITHUB_WORKSPACE"
          pwd
          ls -ld whisper.env.example

          [ "$BUILD_ONLY" = "true" ] && BUILD_ONLY=""
          ts_now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          docker buildx build \
            --progress plain \
            --platform=linux/arm64 \
            --build-arg BUILD_DATE=$ts_now \
            --build-arg VCS_REF=${GITHUB_SHA::8} \
            --build-arg VERSION=latest \
            --cache-from type=local,src="${RUNNER_TEMP}/.buildx-cache" \
            --cache-to type=local,dest="${RUNNER_TEMP}/.buildx-cache-new" \
            -t "$DOCKER_USER/whisper-server:latest-arm64" \
            --pull \
            ${BUILD_ONLY:+--push} \
            .

          docker buildx build \
            --progress plain \
            --platform=linux/arm64 \
            --build-arg BUILD_DATE=$ts_now \
            --build-arg VCS_REF=${GITHUB_SHA::8} \
            --build-arg VERSION=latest \
            --cache-from type=local,src="${RUNNER_TEMP}/.buildx-cache-new" \
            -t "quay.io/$DOCKER_USER/whisper-server:latest-arm64" \
            --pull \
            ${BUILD_ONLY:+--push} \
            .

          /bin/rm -rf "${RUNNER_TEMP}/.buildx-cache"
          /bin/mv -f "${RUNNER_TEMP}/.buildx-cache-new" "${RUNNER_TEMP}/.buildx-cache"
      - name: Clear
        if: always()
        env:
          BUILDER_NAME: ${{ steps.setup_buildx.outputs.builder }}
        run: |
          docker_config="${HOME}/.docker/config.json"
          if [ -f "$docker_config" ]; then
            shred -u "$docker_config" || rm -f "$docker_config"
          fi
          if [ -n "$BUILDER_NAME" ]; then
            docker buildx rm "$BUILDER_NAME" || true
          fi

  manifest:
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'hwdsl2'
    needs: [buildx-amd64, buildx-arm64]
    steps:
      - name: Docker Hub Login
        env:
          DOCKER_USER: ${{ github.repository_owner }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: echo "$DOCKER_TOKEN" | docker login --username "$DOCKER_USER" --password-stdin 2>&1
      - name: Quay.io Login
        env:
          QUAY_USER: ${{ secrets.QUAY_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: echo "$QUAY_TOKEN" | docker login quay.io --username "$QUAY_USER" --password-stdin 2>&1
      - name: Create multi-arch manifest
        env:
          DOCKER_USER: ${{ github.repository_owner }}
          BUILD_ONLY: ${{ secrets.BUILD_ONLY }}
        run: |
          [ "$BUILD_ONLY" = "true" ] && BUILD_ONLY=""
          [ -z "$BUILD_ONLY" ] && exit 0

          # Docker Hub manifest
          docker buildx imagetools create \
            -t "$DOCKER_USER/whisper-server:latest" \
            "$DOCKER_USER/whisper-server:latest-amd64" \
            "$DOCKER_USER/whisper-server:latest-arm64"

          # Quay.io manifest
          docker buildx imagetools create \
            -t "quay.io/$DOCKER_USER/whisper-server:latest" \
            "quay.io/$DOCKER_USER/whisper-server:latest-amd64" \
            "quay.io/$DOCKER_USER/whisper-server:latest-arm64"
      - name: Clear
        if: always()
        run: |
          shred -u "${HOME}/.docker/config.json"
          rm -f "${HOME}/.docker/config.json"
