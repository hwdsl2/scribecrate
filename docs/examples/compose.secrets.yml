# Opt in only with an image built from a revision supporting secret files.
# Merge with the existing base Compose file; retain its volumes and env file.
services:
  whisper:
    image: ${SECRET_FILE_IMAGE:?Set a compatible candidate or released image}
    environment:
      WHISPER_API_KEY_FILE: /run/secrets/api_key
    secrets:
      - api_key

secrets:
  api_key:
    file: ${SECRET_FILE_PATH:?Set the host path to the secret file}
